services:
  - type: web
    name: codecraft-ai-backend
    runtime: image
    repo: https://github.com/abdulboyprogramming-arch/codecraft-ai
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
